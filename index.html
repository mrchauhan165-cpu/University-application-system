<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#0b2545" />
    <meta
      name="description"
      content="University application, approval, notice and statistics portal."
    />
    <title>University Application Portal</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b2545'/%3E%3Cpath d='M16 6 6 11l10 5 10-5z' fill='%234f8dff'/%3E%3Cpath d='M9 15v5c0 2.2 3.1 4 7 4s7-1.8 7-4v-5l-7 3.5z' fill='%23ffffff'/%3E%3C/svg%3E" />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #f4f6fb; }
      .boot { display: flex; align-items: center; justify-content: center; height: 100vh;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #0b2545; }
      .boot-inner { text-align: center; }
      .boot-dot { width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%;
        border: 3px solid #dbe5f5; border-top-color: #1e56a0; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-dot { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><div class="boot-inner"><div class="boot-dot"></div><p>Loading portal…</p></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // If the bundle never boots (blocked script, stale build), do not leave the
      // visitor staring at a spinner — tell them what to try.
      setTimeout(function () {
        var boot = document.querySelector('.boot');
        if (!boot) return;
        boot.innerHTML =
          '<div class="boot-inner"><p><strong>The portal did not finish loading.</strong></p>' +
          '<p style="font-size:13px;color:#465a75;max-width:32ch;margin:8px auto 0">' +
          'Reload the page. If it keeps happening, open this link in a normal browser tab ' +
          '(not an embedded preview) and allow storage for the site.</p>' +
          '<p><button onclick="location.reload()" style="margin-top:10px;padding:8px 14px;border-radius:8px;border:0;' +
          'background:#1e56a0;color:#fff;font:inherit;cursor:pointer">Reload</button></p></div>';
      }, 9000);
    </script>
  </body>
</html>
