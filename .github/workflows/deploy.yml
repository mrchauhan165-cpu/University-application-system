name: Build and deploy to GitHub Pages

# Runs on every push to main. Also runnable by hand from the Actions tab,
# which is handy on a phone (Actions → this workflow → Run workflow).
on:
  push:
    branches: [main]
  # Can be run by hand on ANY branch: Actions -> this workflow -> Run workflow ->
  # pick the branch. That publishes a preview without merging anything.
  workflow_dispatch:

# Least privilege: only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
        # UI tests run in jsdom, so no browser download is needed in CI.

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on with the workflow build type if it is not enabled yet,
          # so no manual Settings toggle is needed. Requires pages: write (above).
          enablement: true

      - name: Build static site
        # Base path comes from Pages itself (/<repo>/ for project sites, / for user
        # sites and custom domains). BASE_PATH can override it (Settings → Variables).
        env:
          VITE_BASE_PATH: ${{ vars.BASE_PATH || format('{0}/', steps.pages.outputs.base_path) }}
        run: npm run build

      - name: Make sure no source maps or secrets ship
        run: |
          if grep -rIl --include='*.map' . dist 2>/dev/null; then
            echo "Source maps found in dist"; exit 1;
          fi
          if grep -rIl "service_role" dist 2>/dev/null; then
            echo "Service role reference found in the bundle"; exit 1;
          fi

      - name: Workflow summary
        run: |
          {
            echo "### Deployed ${GITHUB_REF_NAME}"
            echo ""
            echo "Commit: ${GITHUB_SHA:0:7}"
            echo ""
            echo "Site: ${{ steps.pages.outputs.base_url }}/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
