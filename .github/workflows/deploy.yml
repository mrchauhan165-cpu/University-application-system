name: Build and deploy to GitHub Pages

# Runs on every push to main. Also runnable by hand from the Actions tab,
# which is handy on a phone (Actions → this workflow → Run workflow).
on:
  push:
    branches: [main]
  # Can be run by hand on ANY branch: Actions -> this workflow -> Run workflow ->
  # pick the branch. That publishes a preview without merging anything.
  workflow_dispatch:

# Least privilege: only what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Match the version the project is developed and tested on.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        # Output is captured so a failure can be explained on the run page
        # (see the next step) instead of just "exit code 1".
        run: |
          set -o pipefail
          npm test 2>&1 | tee vitest.log

      - name: Explain test failures
        if: failure()
        run: node scripts/annotate-failures.mjs vitest.log

      - name: Check whether Pages is enabled
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Creating a Pages site needs repository *admin* rights, which the
          # workflow token does not have. Enabling Pages is a one-time click for
          # the repository owner: Settings -> Pages -> Source: GitHub Actions.
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled for this repository. Build and tests ran normally; deployment is skipped. Enable it once: Settings -> Pages -> Build and deployment -> Source: GitHub Actions."
          fi

      - name: Resolve base path
        id: pages
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Build static site
        # Base path comes from Pages itself (/<repo>/ for project sites, / for user
        # sites and custom domains). BASE_PATH can override it (Settings → Variables).
        env:
          # Pages' own base path when available, otherwise the project-site
          # default. BASE_PATH (repository variable) always wins.
          VITE_BASE_PATH: ${{ vars.BASE_PATH || (steps.pages.outputs.base_path != '' && format('{0}/', steps.pages.outputs.base_path)) || format('/{0}/', github.event.repository.name) }}
          # Publishable values only. Set them once under
          # Settings -> Secrets and variables -> Actions -> Variables
          # (or as Secrets; both work). Never add a service-role key here.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Make sure no source maps or secrets ship
        run: |
          if grep -rIl --include='*.map' . dist 2>/dev/null; then
            echo "Source maps found in dist"; exit 1;
          fi
          if grep -rIl "service_role" dist 2>/dev/null; then
            echo "Service role reference found in the bundle"; exit 1;
          fi

      - name: Workflow summary
        run: |
          {
            echo "### Verified build: ${GITHUB_REF_NAME}"
            echo ""
            echo "Commit: \`${GITHUB_SHA:0:7}\`"
            echo ""
            if [ "${{ steps.pages_check.outputs.enabled }}" = "true" ]; then
              echo "Deployed to: ${{ steps.pages.outputs.base_url }}/"
            else
              echo "Build, typecheck and all tests passed. **Deployment was skipped because GitHub Pages is not enabled yet.**"
              echo ""
              echo "Enable it once (repository owner): **Settings → Pages → Build and deployment → Source: GitHub Actions**, then re-run this workflow."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Skipped (not failed) until Pages is switched on for the repository.
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
